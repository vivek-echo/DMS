<div class="row g-4">
  <div class="col-12">
    <div class="card border-0 shadow-sm catalog-intro overflow-hidden">
      <div class="card-body p-4 p-lg-5 d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
        <div>
          <span class="badge intro-badge mb-3">
            <i class="ti ti-briefcase-2 me-2"></i>Open Roles
          </span>
          <h3 class="mb-2">View Jobs / Internships</h3>
          <p class="text-muted mb-0">Browse responsive opportunity cards built with static demo content and Bootstrap 5.</p>
        </div>

        <a routerLink="/application/add-job" class="btn btn-primary">
          <i class="ti ti-plus me-2"></i>Add Job
        </a>
      </div>
    </div>
  </div>

  <div class="col-md-6 col-xl-4" *ngFor="let job of jobs">
    <div class="card border-0 shadow-sm h-100 job-card">
      <div class="job-banner">
        <img [src]="job.bannerImage" [alt]="job.title" class="card-img-top banner-image" />
        <span [class]="getTypeClass(job.type)">
          <i class="ti ti-briefcase me-1"></i>{{ job.type }}
        </span>
      </div>

      <div class="card-body d-flex flex-column p-4">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="company-avatar">
            {{ job.company.charAt(0) }}
          </div>
          <div>
            <p class="company-label mb-1">Company</p>
            <h6 class="mb-0">{{ job.company }}</h6>
          </div>
        </div>

        <h5 class="card-title mb-2">{{ job.title }}</h5>
        <p class="job-description mb-4">{{ job.description }}</p>

        <div class="detail-list mb-4">
          <div class="detail-item">
            <i class="ti ti-map-pin"></i>
            <span>{{ job.location }}</span>
          </div>
          <div class="detail-item">
            <i class="ti ti-currency-rupee"></i>
            <span>{{ job.salary }}</span>
          </div>
        </div>

        <div class="skill-list mb-4">
          <span class="skill-chip" *ngFor="let skill of job.skills">{{ skill }}</span>
        </div>

        <button type="button" class="btn btn-primary w-100 mt-auto">
          <i class="ti ti-send me-2"></i>Apply Now
        </button>
      </div>
    </div>
  </div>
</div>
